services:
  decimal-odometer:
    build:
      context: .
      pull: true
    image: decimal-odometer:local
    container_name: decimal-odometer
    restart: unless-stopped
    ports:
      # Set ODOMETER_PORT=127.0.0.1:8080 to expose the page only to a local reverse proxy.
      - "${ODOMETER_PORT:-8080}:8080"
